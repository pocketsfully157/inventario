<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário de Equipamentos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Inventário de Equipamentos</h1>
    <button id="btn-novo" class="primario">+ Registar equipamento</button>
  </header>

  <main>
    <section id="resumo" class="cartoes"></section>

    <section class="filtros">
      <input id="f-texto" type="search" placeholder="Pesquisar por ID, nº de série, modelo, local…">
      <select id="f-marca"><option value="">Todas as marcas</option></select>
      <select id="f-modelo"><option value="">Todos os modelos</option></select>
      <select id="f-estado"><option value="">Todos os estados</option></select>
      <button id="btn-repor">Repor dados iniciais</button>
    </section>

    <p id="contagem"></p>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th data-campo="id">ID</th>
            <th data-campo="numeroSerie">Nº Série</th>
            <th data-campo="marca">Marca</th>
            <th data-campo="modelo">Modelo</th>
            <th data-campo="tipo">Tipo</th>
            <th data-campo="estado">Estado</th>
            <th data-campo="localizacao">Localização</th>
            <th data-campo="dataAquisicao">Aquisição</th>
            <th data-campo="preco">Preço</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-titulo">Registar equipamento</h2>
      <label>Nº de série <input name="numeroSerie" required></label>
      <label>Marca <select name="marca" required></select></label>
      <label>Modelo <select name="modelo" required></select></label>
      <label>Tipo <input name="tipo" readonly></label>
      <label>Estado <select name="estado" required></select></label>
      <label>Localização <input name="localizacao" required></label>
      <label>Data de aquisição <input name="dataAquisicao" type="date" required></label>
      <label>Preço (€) <input name="preco" type="number" min="0" step="1" required></label>
      <p id="erro" class="erro"></p>
      <div class="acoes">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/dados.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
